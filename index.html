 
<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>

        <p>Manage Your Daily Expenses</p>

        <h2>Add New Expense</h2>

        <form>

            <label>Expense Name</label>
            <input type="text" placeholder="Enter expense name">

            <label>Amount</label>
            <input type="number" placeholder="Enter amount">

            <label>Select Category</label>

            <select>
                <option>Choose Category</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Education</option>
                <option>Other</option>
            </select>

            <button type="button">Add Expense</button>

        </form>

       

        <h2>My Expenses</h2>

      

        <div class="expense">

            <h3>Lunch</h3>
            <p>Amount: ₹100</p>
            <p>Category: Food</p>

            <button class="delete">Delete</button>

        </div>

        <div class="expense">

            <h3>Movie Ticket</h3>
            <p>Amount: ₹149</p>
            <p>Category: Entertainment</p>
            <button class="delete">Delete</button>

        </div>

         <div class="expense">

            <h3>PS 5</h3>
            <p>Amount: ₹150</p>
            <p>Category: Electronics</p>
            <button class="delete">Delete</button>

        </div>

    </div>

</body>
</html>
